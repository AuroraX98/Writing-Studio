<div id="writer-hybrid" aria-label="Professional writing workspace concept">
  <header class="w-top">
    <div class="w-brand"><span class="w-monogram" aria-hidden="true">Wd.</span><div><strong>Writing Desk</strong><span class="w-secondary">Editorial × Creative Studio</span></div></div>
    <div class="w-settings">
      <label for="w-type">Project type<select id="w-type"><option value="fiction">Fiction</option><option value="nonfiction" selected>Nonfiction</option><option value="memoir">Memoir</option></select></label>
      <label for="w-theme">Theme<select id="w-theme"><option value="light">Light grey</option><option value="dark">Dark grey</option><option value="glass" selected>Pastel glass</option></select></label>
      <label for="w-font">Manuscript font<select id="w-font"><option value="chalkboard">Chalkboard</option><option value="serif">Book serif</option><option value="sans">Sans serif</option></select></label>
      <button type="button" id="w-focus" aria-pressed="false">Focus mode</button>
    </div>
  </header>
  <nav class="w-nav" aria-label="Workspace views">
    <button type="button" data-view="write" aria-pressed="true">Studio</button>
    <button type="button" data-view="plan" aria-pressed="false">Chapter board</button>
    <button type="button" data-view="research" aria-pressed="false">Research</button>
    <button type="button" data-view="revise" aria-pressed="false">Revise</button>
    <button type="button" data-view="export" aria-pressed="false">Export</button>
  </nav>
  <div class="w-shell">
    <aside class="w-tree" aria-label="Manuscript navigation">
      <label for="w-search">Find chapters or notes</label>
      <input type="search" id="w-search" placeholder="Search this project">
      <h3>Manuscript</h3>
      <div id="w-chapters"></div>
      <hr>
      <p class="w-secondary">One project. Connected chapters, notes, sources, and revision tasks.</p>
    </aside>
    <main id="w-main" aria-label="Selected workspace view"></main>
    <aside class="w-context" id="w-context" aria-label="Chapter context"></aside>
  </div>
  <footer class="w-footer"><span id="w-wordcount"></span><label id="w-transparency-control" hidden><input type="checkbox" id="w-solid"> Reduce transparency</label><span>Design mockup · sample project · edits reset on reload</span></footer>
</div>

<script>

  {id:'opening',title:'The opening',status:'Drafting',summary:'Begin with a specific moment. Introduce the central question through an experience.',text:'I arrived before the room filled. For a few minutes, there was only the sound of chairs moving and rain against the windows. I opened my notebook and wrote the question I had been avoiding.\n\nThe question was simple. My answer was not. I had collected explanations from other people, but I had not stopped to describe what I actually noticed.\n\nThis book begins with that pause. Each chapter follows an experience, a question, and the understanding that developed from looking more closely.',note:'Keep the opening grounded in a specific experience. Return to the central question at the end of the chapter.',task:'Replace the general explanation with a concrete example.'},

 // Original, optional planning prompts. These are patterns to adapt, not chapter requirements.

  fiction:{

   thriller:{name:'Thriller / suspense',items:[['Threat','What danger exists, and who is affected?'],['Immediate goal','What must someone accomplish or prevent? Is time a factor?'],['Resistance','What blocks action or makes a choice risky?'],['Shift in pressure','Does danger rise, briefly ease, or become clearer? Vary the intensity.'],['Consequence','What new cost, uncertainty, or urgent decision follows?']],map:[['Danger emerges','Give the reader a reason to worry and a person to follow.'],['Response','Show attempts to understand, escape, or stop the threat.'],['Escalation','Increase the costs and complicate the available choices.'],['Setback or reversal','Change what the protagonist knows or can do.'],['Confrontation','Resolve the central danger through consequential action.'],['Fallout','Show survival, loss, and what the outcome changes.']]},

 root.addEventListener('input',e=>{if(e.target.id==='w-search')tree();else if(e.target.id==='w-draft'){checkTypedWord(e);selected().text=e.target.value;count();fitText();}else if(e.target.id==='w-outline'){selected().planOutline=e.target.value;fitText();}else if(e.target.id==='w-note'){selected().note=e.target.value;fitText();}else if(e.target.id==='w-idea'){selected().idea=e.target.value;fitText();}else if(e.target.id==='w-saved'){selected().saved=e.target.value;fitText();}});
 root.addEventListener('keydown',e=>{if(e.target.id==='w-draft'&&lastCorrection&&(e.metaKey||e.ctrlKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'){e.preventDefault();undoTypingCorrection();}});
 root.addEventListener('toggle',e=>{if(e.target.classList?.contains('w-outline')){selected().outlineOpen=e.target.open;fitText();}},true);
 root.addEventListener('dragstart',e=>{const card=e.target.closest('[data-card]');if(card&&e.dataTransfer){e.dataTransfer.setData('text/plain',card.dataset.card);e.dataTransfer.effectAllowed='move';}});
 root.addEventListener('dragover',e=>{if(e.target.closest('[data-card]'))e.preventDefault();});
 root.addEventListener('drop',e=>{const target=e.target.closest('[data-card]');if(!target||!e.dataTransfer)return;e.preventDefault();const id=e.dataTransfer.getData('text/plain'),i=chapters.findIndex(x=>x.id===id);if(i<0||target.dataset.card===id)return;const [moved]=chapters.splice(i,1);const j=chapters.findIndex(x=>x.id===target.dataset.card);chapters.splice(j,0,moved);render();});
 root.addEventListener('change',e=>{if(e.target.id==='w-typing'){state.typing=e.target.value;typingSuggestions=[];lastCorrection=null;root.querySelector('#w-draft').spellcheck=state.typing!=='off';updateTyping();}else if(e.target.id==='w-theme'){state.theme=e.target.value;appearance();}else if(e.target.id==='w-solid'){state.solidGlass=e.target.checked;appearance();}else if(e.target.id==='w-font'){state.font=e.target.value;appearance();fitText();}else if(e.target.id==='w-type'){state.type=e.target.value;render();}else if(e.target.id==='w-genre'){state.genres[state.type]=e.target.value;render();}else if(e.target.id==='w-role'){const c=selected();c.roles=c.roles||{};c.roles[state.type]=e.target.value;render();}else if(e.target.dataset.guidePick!==undefined){const c=selected(),key=guideKey(c);c.guidePicks=c.guidePicks||{};c.guidePicks[key]=c.guidePicks[key]||{};c.guidePicks[key][e.target.dataset.guidePick]=e.target.checked;}else if(e.target.id==='w-format'){state.format=e.target.value;exportDetail();}else if(e.target.dataset.task){selected().done=e.target.checked;}else if(e.target.dataset.review){const c=selected();c.review=c.review||{};c.review[e.target.dataset.review]=e.target.checked;}if(['w-typing','w-theme','w-solid','w-font','w-type','w-genre'].includes(e.target.id))rememberChoices();});
 render();
 let previousWidth=0;new ResizeObserver(entries=>{const width=entries[0].contentRect.width;if(width!==previousWidth){previousWidth=width;fitText();}}).observe(root);
 if(globalThis.Tweak){const tweak=new Tweak({container:root,onChange:render});tweak.addToggle(state,'context',{label:'Show chapter context'});tweak.addSlider(state,'prose',{label:'Draft text size',min:16,max:22,unit:'px'});}
})();
</script>
